# CI substrate — 7-job pipeline per the CI/CD research doc (art_O0T4HZMZ).
#
# Tracking decision (substrate task todo_QNAl5K7v, triaged by the deps-security
# task 2026-09-17): security-audit is BLOCKING. The scaffold dependency freeze
# that carried 206 known vulnerabilities in 22 packages was replaced with a
# minimal, app-scoped pin set; pip-audit and npm audit are clean at flip time.
#
# Frontend jobs are resilient to the in-flight CRA→Vite migration: they prefer
# package-lock.json (npm ci), fall back to yarn.lock (frozen), then plain npm
# install — and invoke package.json scripts rather than tool names.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Weekly full security pass, Monday 04:17 UTC
    - cron: "17 4 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- 1. backend-ruff ------------------------------------------------------
  backend-ruff:
    name: backend-ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff (version pinned in backend/requirements.txt)
        run: pip install ruff==0.16.8
      - name: Ruff check
        run: ruff check backend tests

  # ---- 2. backend-pytest ----------------------------------------------------
  backend-pytest:
    name: backend-pytest
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017/claimos-test
      DB_NAME: claimos-test
      CORS_ORIGINS: http://localhost:3000
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 20s
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Run pytest (root smoke suite + backend adapter tests)
        run: pytest tests/ backend/tests/ -v

  # ---- 3. frontend-lint -----------------------------------------------------
  frontend-lint:
    name: frontend-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci → yarn frozen → npm install)
        run: |
          set -eux
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi
      - name: Lint
        run: |
          set -eux
          # Use the package script when present (the Vite migration owns it);
          # otherwise lint with the committed eslint.config.js.
          if grep -q '"lint"' package.json; then
            npm run lint
          else
            npx eslint .
          fi

  # ---- 4. frontend-test -----------------------------------------------------
  frontend-test:
    name: frontend-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (npm ci → yarn frozen → npm install)
        run: |
          set -eux
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --frozen-lockfile
          else
            npm install --no-audit --no-fund
          fi
      - name: Test
        run: CI=true npm test

  # ---- 5. docker-builds -----------------------------------------------------
  docker-builds:
    name: docker-builds
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compute lowercase image prefix (GHCR requires lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - name: Log in to GHCR (main pushes only)
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_PREFIX }}/web:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---- 6. security-audit ----------------------------------------------------
  security-audit:
    name: security-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: pip-audit (backend, against the resolved environment)
        # Blocking since the 2026-09-17 deps triage: the scaffold freeze that
        # carried 206 known vulnerabilities in 22 packages was replaced with a
        # minimal app-scoped pin set (pip-audit clean at flip time). Any new
        # finding fails this job and blocks merge.
        run: |
          python -m venv /tmp/audit-venv
          # Upgrade the venv-seeded pip first: `python -m venv` seeds the
          # runner image's pip, which ages on the image and accumulates its
          # own advisories — without this the audit fails on the installer
          # (12 findings on seeded pip 25.0.1) instead of on dependencies.
          /tmp/audit-venv/bin/pip install --upgrade pip
          /tmp/audit-venv/bin/pip install pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
          /tmp/audit-venv/bin/pip-audit
      - name: npm audit (frontend, production deps only)
        # Blocking since the 2026-09-17 deps triage (0 production findings at
        # flip time; findings now fail the job and block merge).
        run: |
          set -eux
          cd frontend
          if [ -f package-lock.json ]; then
            npm ci --omit=dev
            npm audit --omit=dev
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --production --frozen-lockfile
            yarn audit --groups dependencies
          else
            npm install --omit=dev --no-audit --no-fund
            npm audit --omit=dev
          fi

  # ---- 7. e2e-compose -------------------------------------------------------
  # Full-stack Playwright run against the docker-compose topology (nginx web
  # tier + api + durable worker + Mongo) on the deterministic fixture LLM —
  # zero Anthropic API spend. Fault-injected worker recreations then cover
  # the live-LLM failure classes: forced agent failure and the decision
  # refusal-retry/template-letter fallback.
  e2e-compose:
    name: e2e-compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fixture mode keeps the pipeline scripted: deterministic and free.
      LLM_PROVIDER: fixture
      INVITE_CODE: fnol-e2e-invite
      # Every spec shares one compose client IP, so all logins draw from a
      # single bucket — including the two fault-phase re-runs that follow the
      # main suite. The default 5/minute limit trips long before the suite
      # ends, and 30/minute tripped once the portal-upload spec's logins were
      # added (the refusal spec's final UI login got the 429).
      LOGIN_RATE_LIMIT: 60/minute
      # Low enough that the portal rate-limit spec reaches 429 in a few
      # requests; high enough that the 10s portal poller never trips it.
      STATUS_LOOKUP_RATE_LIMIT: 10/minute
      # Adjuster sessions come from the seeded demo account — public
      # registration is customer-only. The job-level env flows into compose
      # (api service seeds the account at startup) and into the Playwright
      # helpers, which read the same pair (frontend/e2e/utils.js).
      DEMO_ADJUSTER_EMAIL: adjuster-e2e@claimos.dev
      DEMO_ADJUSTER_PASSWORD: e2e-Adjuster!42
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps + Playwright Chromium
        working-directory: frontend
        run: |
          set -eux
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi
          npx playwright install --with-deps chromium
      - name: Boot the compose stack (fixture LLM)
        run: docker compose up -d --build
      - name: Wait for /api/ready and the web tier
        run: |
          set -eux
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/api/ready >/dev/null 2>&1 && break
            echo "api not ready (attempt $i/60)"
            sleep 2
          done
          curl -fsS http://localhost:8000/api/ready
          for i in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200" ] && break
            echo "web tier not ready (attempt $i/30)"
            sleep 2
          done
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/)" = "200" ]
      - name: Run the Playwright suite (clean fixture stack)
        working-directory: frontend
        run: npx playwright test
      - name: Dump compose diagnostics on failure
        if: failure()
        run: |
          mkdir -p frontend/test-results/compose-logs
          docker compose ps | tee frontend/test-results/compose-logs/compose-ps.txt
          docker compose logs --no-color api worker | tee frontend/test-results/compose-logs/api-worker.log
          # Web tier is the hop between the browser and the api — its nginx
          # access/error log is the missing witness when a response the api
          # definitely sent (uvicorn access-log 201) never fires Playwright's
          # response event. nginx -T also proves the rendered template.
          docker compose logs --no-color web | tee frontend/test-results/compose-logs/web.log
          docker compose exec -T web nginx -T 2>&1 | tee frontend/test-results/compose-logs/nginx-rendered.conf || true
          docker inspect --format '{{json .State.Health}}' claimos-web-1 | tee frontend/test-results/compose-logs/web-health.json || true
      - name: Recreate the worker with a forced agent failure
        run: |
          FIXTURE_FAULT=timeout:intake docker compose up -d --no-deps --force-recreate worker
          sleep 3
      - name: Run the forced-failure spec
        working-directory: frontend
        env:
          FIXTURE_FAULT: timeout:intake
        run: npx playwright test e2e/agent-failure.spec.js
      - name: Recreate the worker with a persistent decision refusal
        run: |
          FIXTURE_FAULT=refusal:decision docker compose up -d --no-deps --force-recreate worker
          sleep 3
      - name: Run the refusal-fallback spec
        working-directory: frontend
        env:
          FIXTURE_FAULT: refusal:decision
        run: npx playwright test e2e/refusal-fallback.spec.js
      - name: Dump compose diagnostics after fault phases
        if: failure()
        run: |
          mkdir -p frontend/test-results/compose-logs
          docker compose ps | tee frontend/test-results/compose-logs/compose-ps-fault.txt
          docker compose logs --no-color api worker | tee frontend/test-results/compose-logs/api-worker-fault.log
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: frontend/test-results/
          retention-days: 5

  # ---- 8. lint-workflows ----------------------------------------------------
  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint (pinned release, checksum-verified)
        run: |
          VERSION=1.7.12
          curl -fsSL -O "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_checksums.txt"
          curl -fsSL -o "actionlint_${VERSION}_linux_amd64.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          grep "linux_amd64.tar.gz" "actionlint_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" actionlint
          ./actionlint -color
