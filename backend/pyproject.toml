[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Substrate baseline: pycodestyle errors (E4/E7/E9) + pyflakes (F).
# No code changes were allowed in this task, so rules that flag existing
# scaffold code (style E5, naming, etc.) are intentionally not selected.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# server.py: load_dotenv must run before the database/agents imports (E402 is
# the deliberate env-then-import pattern); `db` is re-exported for callers (F401).
# agents.py: unused `asyncio` import is scaffold cruft — the backend-hardening
# task cleans imports and can drop these ignores.
"server.py" = ["E402", "F401"]
"agents.py" = ["F401"]
