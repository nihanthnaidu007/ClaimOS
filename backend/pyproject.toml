# ClaimOS backend project configuration.
#
# Lint: pip install ruff && ruff check .

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Keep the bar at correctness and obvious hygiene (ruff's default rule set):
# E4/E7/E9 pycodestyle subset, F pyflakes (unused imports/variables, undefined
# names, f-string issues). Style rules (E5, naming, etc.) are intentionally not
# selected. PR #3 (CI substrate) shipped the same set; this file merges the two.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# server.py loads backend/.env BEFORE importing local modules that read env vars
# at import time (database.py raises without MONGO_URL) — the late imports are
# deliberate load order, not an oversight.
"server.py" = ["E402"]

[tool.pytest.ini_options]
# Backend-local runs (`pytest` from backend/) pick up the hardening suite here.
# The CI workflow invokes pytest from the repo root, where pytest-asyncio's
# strict default applies; test_durable_state.py carries explicit asyncio markers.
asyncio_mode = "auto"
testpaths = ["tests"]
