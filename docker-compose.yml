# ClaimOS local stack — mirrors the production topology
# (api + worker on one backend image, nginx web tier, MongoDB).
#
# Run: docker compose up -d --build, then open http://localhost:3000
# LLM-backed agent pipelines need ANTHROPIC_API_KEY in the environment. The
# stack starts without it, but pipeline runs fail fast with a typed error
# from the Anthropic adapter instead of silently degrading.
# For deterministic E2E (no API spend): LLM_PROVIDER=fixture INVITE_CODE=<code> \
#   docker compose up -d --build

services:
  api:
    build: ./backend
    image: claimos-api
    environment:
      MONGO_URL: mongodb://mongo:27017/claimos
      DB_NAME: claimos
      CORS_ORIGINS: http://localhost:3000
      UPLOAD_DIR: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Deterministic E2E/CI mode: LLM_PROVIDER=fixture runs the pipeline on
      # scripted outputs (zero API spend); FIXTURE_FAULT injects live-LLM
      # failure classes; INVITE_CODE enables self-registration for tests.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      FIXTURE_FAULT: ${FIXTURE_FAULT:-}
      INVITE_CODE: ${INVITE_CODE:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/minute}
      STATUS_LOOKUP_RATE_LIMIT: ${STATUS_LOOKUP_RATE_LIMIT:-60/minute}
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  worker:
    image: claimos-api  # same backend image as api; CI needs no separate build
    # The worker polls the claim_runs queue; SIGTERM triggers a graceful
    # checkpoint-and-requeue exit (compose sends it on `docker compose stop`).
    command: ["python", "worker.py"]
    environment:
      MONGO_URL: mongodb://mongo:27017/claimos
      DB_NAME: claimos
      UPLOAD_DIR: /data/uploads
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Same fixture controls as the api service — the worker is where the
      # pipeline (and therefore the fixture adapter and faults) actually runs.
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      FIXTURE_FAULT: ${FIXTURE_FAULT:-}
      INVITE_CODE: ${INVITE_CODE:-}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5/minute}
      STATUS_LOOKUP_RATE_LIMIT: ${STATUS_LOOKUP_RATE_LIMIT:-60/minute}
    volumes:
      - uploads:/data/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  mongo:
    image: mongo:7
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mongodata:
  uploads:
